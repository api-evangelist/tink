specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Tink
providerId: tink
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
  - Open Banking
  - Plans
description: >-
  Tink does not publish list pricing. All plans are sales-led contracts: a sandbox / developer
  portal is free, while production access is priced per consented end user, per call, or per
  payment depending on product. Visa-affiliated discounts apply to existing Visa relationships.
notes: Tink lists no public price; figures are commercial-contract typical.
sources:
  - https://tink.com/pricing/
  - https://docs.tink.com/
plans:
  - id: tink-sandbox
    name: Sandbox / Developer
    type: trial
    description: Free developer-portal sandbox with simulated banks for testing.
    entries:
      - label: Subscription
        name: sandbox_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: emea
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Simulated bank fixtures
      - name: All product surfaces
  - id: tink-production
    name: Production (Custom Contract)
    type: enterprise
    description: Sales-led contract priced per consented user, per API call, or per payment.
    entries:
      - label: Custom pricing
        name: production_custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: contract
        geo: emea
        unit: 1
        price: contact sales
        userMultiplied: true
    elements:
      - name: Per-consented-user, per-call, or per-payment pricing
      - name: PSD2 production access
      - name: SLA and support tier negotiated
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
